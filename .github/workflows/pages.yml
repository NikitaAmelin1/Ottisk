name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          # Static web assets only (skip native/mobile tooling)
          for item in \
            index.html landing.html trailer.html donate.html privacy.html support.html editor.html \
            manifest.json sw.js robots.txt sitemap.xml .nojekyll \
            ottisk-ad-ru-15s.mp4 \
            css js assets icons store content; do
            if [ -e "$item" ]; then
              cp -a "$item" _site/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
